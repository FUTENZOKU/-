            // DOM要素の取得
            const calendarDaysEl = document.getElementById('calendar-days');
            const currentMonthYearEl = document.getElementById('currentMonthYear');
            const prevMonthBtn = document.getElementById('prev-month');
            const nextMonthBtn = document.getElementById('next-month');

            const modalEl = document.getElementById('event-modal');
            const closeModalBtn = document.getElementById('close-modal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalDateBadge = document.getElementById('modalDateBadge');
            const modalTitle = document.getElementById('modalTitle');
            const modalContent = document.getElementById('modalContent');
            const modalTicketBtn = document.getElementById('modalTicketBtn');
            const modalRadioBtn = document.getElementById('modalRadioBtn');
            const modalFlyerContainer = document.getElementById('modalFlyerContainer');

            let now = new Date();
            let displayYear = now.getFullYear();
            let displayMonth = now.getMonth();

            function formatDateKey(year, month, day) {
                const m = String(month + 1).padStart(2, '0');
                const d = String(day).padStart(2, '0');
                return `${year}-${m}-${d}`;
            }
            // 簡易祝日判定データ（主要な祝日・振替休日）
            function getHolidayName(year, month, day) {
                const m = month + 1;
                const d = day;
                const dateStr = `${m}/${d}`;

                // 固定祝日
                const fixedHolidays = {
                    '1/1': '元日',
                    '2/11': '建国記念の日', '2/23': '天皇誕生日',
                    '4/29': '昭和の日', '5/3': '憲法記念日', '5/4': 'みどりの日', '5/5': 'こどもの日',
                    '8/11': '山の日', '11/3': '文化の日', '11/23': '勤労感謝の日', '12/23': '天皇誕生日'
                };
                if (fixedHolidays[dateStr]) return fixedHolidays[dateStr];

                // ハッピーマンデー等（第N月曜日など）の判定
                const dayOfWeek = new Date(year, month, day).getDay();
                const nthMonday = Math.ceil(day / 7);

                if (dayOfWeek === 1) { // 月曜日
                    if (m === 1 && nthMonday === 2) return '成人の日';
                    if (m === 7 && nthMonday === 3) return '海の日';
                    if (m === 9 && nthMonday === 3) return '敬老の日';
                    if (m === 10 && nthMonday === 2) return 'スポーツの日';
                }

                // 春分の日・秋分の日（概算）
                if (m === 3 && d === Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4))) return '春分の日';
                if (m === 9 && d === Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4))) return '秋分の日';

                return null;
            }

            // 第一水曜日かどうかを判定する関数
            function isFirstWednesday(year, month, day) {
                const date = new Date(year, month, day);
                return date.getDay() === 3 && day <= 7;
            }

            // カレンダー描画関数
function renderCalendar(year, month) {
    if (!calendarDaysEl) return;
    calendarDaysEl.innerHTML = '';

    if (currentMonthYearEl) {
        currentMonthYearEl.textContent = `${year}年 ${month + 1}月`;
    }

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();
    
    // 前月の最終日を取得（前月の日付計算用）
    const prevMonthLastDay = new Date(year, month, 0).getDate();

    // 常に6行（7列×6行＝42マス）に固定
    const totalGridCells = 42;

    // 1. 【前月の日付】をうっすら表示
    for (let i = firstDay - 1; i >= 0; i--) {
        const prevDay = prevMonthLastDay - i;
        const emptyCell = document.createElement('div');
        emptyCell.className = 'h-12 sm:h-20 border border-[#12100e]/15 bg-gray-50/50 p-0.5 sm:p-1 text-black/30 font-bold text-xs sm:text-base select-none';
        emptyCell.textContent = prevDay;
        calendarDaysEl.appendChild(emptyCell);
    }

    // 2. 【当月の日付】を表示
    for (let day = 1; day <= totalDays; day++) {
        const dateKey = formatDateKey(year, month, day);
        const liveData = liveEvents[dateKey];
        const hasRadio = isFirstWednesday(year, month, day);

        const holidayName = getHolidayName(year, month, day);
        const dayOfWeek = new Date(year, month, day).getDay();
        const isSunday = (dayOfWeek === 0);
        const isSaturday = (dayOfWeek === 6);
        const isHoliday = !!holidayName;

        let dayNumberColor = 'text-[#12100e]';
        if (isSunday || isHoliday) {
            dayNumberColor = 'text-[#801e20]';
        } else if (isSaturday) {
            dayNumberColor = 'text-[#1c2d42]';
        }

        const dayCell = document.createElement('div');
        dayCell.className = 'h-12 sm:h-20 border-2 border-[#12100e] bg-white p-0.5 sm:p-1 flex flex-col justify-between cursor-pointer hover:bg-[#12100e] hover:text-[#e8e0d5] transition-colors group relative shadow-[2px_2px_0px_0px_rgba(18,16,14,1)]';

        let innerHTML = `
            <div class="flex justify-between items-start leading-none gap-0.5">
                <span class="font-black text-xs sm:text-base ${dayNumberColor} group-hover:text-[#e8e0d5] shrink-0">${day}</span>
                ${isHoliday ? `<span class="text-[7px] sm:text-[10px] text-[#801e20] group-hover:text-[#e8e0d5] font-bold text-right leading-tight break-all">${holidayName}</span>` : ''}
            </div>
        `;

        innerHTML += `<div class="flex flex-col gap-0.5 w-full mt-auto">`;

        if (liveData) {
            const pref = liveData.location ? liveData.location.substring(0, 2) : '公演';
            innerHTML += `
            <div class="bg-[#801e20] group-hover:bg-[#e8e0d5] text-[#e8e0d5] group-hover:text-[#801e20] border border-[#12100e] text-[8px] sm:text-xs font-bold px-0.5 py-0.5 text-center leading-none tracking-tighter whitespace-nowrap overflow-hidden">
                ${pref}
            </div>
        `;
        }

        if (hasRadio) {
            innerHTML += `
            <div class="bg-[#1c2d42] group-hover:bg-[#e8e0d5] text-[#e8e0d5] group-hover:text-[#1c2d42] border border-[#12100e] text-[8px] sm:text-xs font-bold px-0 py-0.5 text-center leading-none tracking-tighter whitespace-nowrap overflow-hidden">
                ラジオ
            </div>
        `;
        }

        innerHTML += `</div>`;
        dayCell.innerHTML = innerHTML;
        calendarDaysEl.appendChild(dayCell);
    }

    // 3. 【翌月の日付】をうっすら表示
    const remainingCells = totalGridCells - (firstDay + totalDays);
    for (let nextDay = 1; nextDay <= remainingCells; nextDay++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'h-12 sm:h-20 border border-[#12100e]/15 bg-gray-50/50 p-0.5 sm:p-1 text-black/30 font-bold text-xs sm:text-base select-none';
        emptyCell.textContent = nextDay;
        calendarDaysEl.appendChild(emptyCell);
    }
            }

            // モーダル非表示
            function closeModal() {
                if (modalEl) modalEl.classList.add('hidden');
            }

            // 月切り替えイベント
            if (prevMonthBtn) {
                prevMonthBtn.addEventListener('click', () => {
                    displayMonth--;
                    if (displayMonth < 0) {
                        displayMonth = 11;
                        displayYear--;
                    }
                    renderCalendar(displayYear, displayMonth);
                });
            }

            if (nextMonthBtn) {
                nextMonthBtn.addEventListener('click', () => {
                    displayMonth++;
                    if (displayMonth > 11) {
                        displayMonth = 0;
                        displayYear++;
                    }
                    renderCalendar(displayYear, displayMonth);
                });
            }

            if (closeModalBtn) closeModalBtn.addEventListener('click', closeModal);
            if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModal);

            if (modalEl) {
                modalEl.addEventListener('click', (e) => {
                    if (e.target === modalEl) closeModal();
                });
            }

            // 初期表示
            renderCalendar(displayYear, displayMonth);
        </script>
