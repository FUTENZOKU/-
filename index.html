        const calendarDaysEl = document.getElementById("calendar-days");
        const currentMonthYearEl = document.getElementById("currentMonthYear");

        const nextMonthBtn = document.getElementById("next-month");

        const closeModalBtn = document.getElementById("close-modal");

        let now = new Date();
        let displayYear = now.getFullYear();
        let displayMonth = now.getMonth();

        function formatDateKey(year, month, day) {
            const m = String(month + 1).padStart(2, "0");
            const d = String(day).padStart(2, "0");
            return year + "-" + m + "-" + d;
        }

        function getHolidayName(year, month, day) {
            const m = month + 1;
            const d = day;
            const dateStr = m + "/" + d;
            const fixedHolidays = {
                "1/1": "元日", "2/11": "建国記念の日", "2/23": "天皇誕生日",
                "4/29": "昭和の日", "5/3": "憲法記念日", "5/4": "みどりの日", "5/5": "こどもの日",
                "8/11": "山の日", "11/3": "文化の日", "11/23": "勤労感謝の日"
            };
            if (fixedHolidays[dateStr]) return fixedHolidays[dateStr];
            const dayOfWeek = new Date(year, month, day).getDay();
            const nthMonday = Math.ceil(day / 7);
            if (dayOfWeek === 1) {
                if (m === 1 && nthMonday === 2) return "成人の日";
                if (m === 7 && nthMonday === 3) return "海の日";
                if (m === 9 && nthMonday === 3) return "敬老の日";
                if (m === 10 && nthMonday === 2) return "スポーツの日";
            }
            if (m === 3 && d === Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4))) return "春分の日";
            if (m === 9 && d === Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4))) return "秋分の日";
            return null;
        }

        function isFirstWednesday(year, month, day) {
            const date = new Date(year, month, day);
            return date.getDay() === 3 && day <= 7;
        }

        function openModal(dateKey, liveData, hasRadio) {
            if (!modalEl) return;
            const parts = dateKey.split("-");
            const year = parts[0];
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            if (modalDateBadge) modalDateBadge.textContent = year + "年" + month + "月" + day + "日";

            if (modalFlyerContainer) {
                modalFlyerContainer.innerHTML = "";
                let flyerList = [];
                if (liveData && liveData.flyerUrl) {
                    if (Array.isArray(liveData.flyerUrl)) {
                        flyerList = liveData.flyerUrl;
                    } else if (typeof liveData.flyerUrl === "string" && liveData.flyerUrl.trim() !== "") {
                        flyerList = [liveData.flyerUrl];
                    }
                }
                if (flyerList.length > 0) {
                    flyerList.forEach(function(url) {
                        const img = document.createElement("img");
                        img.src = url;
                        img.alt = "フライヤー画像";
                        img.className = "w-full rounded border-2 border-[#12100e] shadow-md object-contain max-h-[350px]";
                        modalFlyerContainer.appendChild(img);
                    });
                    modalFlyerContainer.classList.remove("hidden");
                    modalFlyerContainer.classList.add("flex");
                } else {
                    modalFlyerContainer.classList.add("hidden");
                    modalFlyerContainer.classList.remove("flex");
                }
            }

            if (modalTitle && modalContent && modalTicketBtn) {
                if (liveData) {
                    modalTitle.textContent = liveData.title || "公演詳細";
                    let contentHTML = '<p><span class="text-[#801e20]">【会場】</span> ' + (liveData.venue || "未定") + " (" + (liveData.location || "") + ")</p>";
                    if (liveData.performers) {
                        contentHTML += '<p><span class="text-[#801e20]">【出演】</span> ' + liveData.performers + "</p>";
                    }
                    contentHTML += '<p><span class="text-[#801e20]">【時間】</span> ' + (liveData.time || "未定") + "</p>" +
                        '<p><span class="text-[#801e20]">【料金】</span> ' + (liveData.price || "未定") + "</p>";
                    if (hasRadio) {
                        contentHTML += '<p class="mt-2 pt-2 border-t border-[#12100e]/30"><span class="text-[#1c2d42]">【ラジオ】</span> bayfm『CURATE radio』放送日 (27:00〜)</p>';
                    }
                    modalContent.innerHTML = contentHTML;
                    if (liveData.ticketUrl) {
                        modalTicketBtn.href = liveData.ticketUrl;
                        modalTicketBtn.classList.remove("hidden");
                    } else {
                        modalTicketBtn.classList.add("hidden");
                    }
                } else if (hasRadio) {
                    modalTitle.textContent = "ラジオ出演";
                    modalContent.innerHTML = '<p><span class="text-[#1c2d42]">【番組名】</span> bayfm『CURATE radio』</p><p><span class="text-[#1c2d42]">【時間】</span> 毎週第一水曜日 27:00〜（木曜午前3時）</p>';
                    modalTicketBtn.classList.add("hidden");
                } else {
                    modalTitle.textContent = "予定情報";
                    modalContent.innerHTML = "<p>この日のライブ予定はありません。</p>";
                    modalTicketBtn.classList.add("hidden");
                }
            }

            if (modalRadioBtn) {
                if (hasRadio) {
                    modalRadioBtn.classList.remove("hidden");
                } else {
                    modalRadioBtn.classList.add("hidden");
                }
            }
            modalEl.classList.remove("hidden");
        }

        function renderCalendar(year, month) {
            if (!calendarDaysEl) return;
            calendarDaysEl.innerHTML = "";
            if (currentMonthYearEl) {
                currentMonthYearEl.textContent = year + "年 " + (month + 1) + "月";
            }
            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const prevMonthLastDay = new Date(year, month, 0).getDate();
            const totalGridCells = 42;

            for (let i = firstDay - 1; i >= 0; i--) {
                const prevDay = prevMonthLastDay - i;
                const emptyCell = document.createElement("div");
                emptyCell.className = "h-12 sm:h-20 border border-[#12100e]/15 bg-gray-50/50 p-0.5 sm:p-1 text-black/30 font-bold text-xs sm:text-base select-none";
                emptyCell.textContent = prevDay;
                calendarDaysEl.appendChild(emptyCell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const dateKey = formatDateKey(year, month, day);
                const liveData = liveEvents[dateKey];
                const hasRadio = isFirstWednesday(year, month, day);
                const holidayName = getHolidayName(year, month, day);
                const dayOfWeek = new Date(year, month, day).getDay();
                const isSunday = (dayOfWeek === 0);
                const isSaturday = (dayOfWeek === 6);
                const isHoliday = !!holidayName;

                let dayNumberColor = "text-[#12100e]";
                if (isSunday || isHoliday) {
                    dayNumberColor = "text-[#801e20]";
                } else if (isSaturday) {
                    dayNumberColor = "text-[#1c2d42]";
                }

                const dayCell = document.createElement("div");
                dayCell.className = "h-12 sm:h-20 border-2 border-[#12100e] bg-white p-0.5 sm:p-1 flex flex-col justify-between cursor-pointer hover:bg-[#12100e] hover:text-[#e8e0d5] transition-colors group relative shadow-[2px_2px_0px_0px_rgba(18,16,14,1)] select-none";

                let innerHTML = '<div class="flex justify-between items-start leading-none gap-0.5 pointer-events-none">';
                innerHTML += '<span class="font-black text-xs sm:text-base ' + dayNumberColor + ' group-hover:text-[#e8e0d5] shrink-0">' + day + '</span>';
                if (isHoliday) {
                    innerHTML += '<span class="text-[7px] sm:text-[10px] text-[#801e20] group-hover:text-[#e8e0d5] font-bold text-right leading-tight break-all">' + holidayName + '</span>';
                }
                innerHTML += '</div>';
                innerHTML += '<div class="flex flex-col gap-0.5 w-full mt-auto pointer-events-none">';

                if (liveData) {
                    const pref = liveData.location ? liveData.location.substring(0, 2) : "公演";
                    innerHTML += '<div class="bg-[#801e20] group-hover:bg-[#e8e0d5] text-[#e8e0d5] group-hover:text-[#801e20] border border-[#12100e] text-[8px] sm:text-xs font-bold px-0.5 py-0.5 text-center leading-none tracking-tighter whitespace-nowrap overflow-hidden">' + pref + '</div>';
                }
                if (hasRadio) {
                    innerHTML += '<div class="bg-[#1c2d42] group-hover:bg-[#e8e0d5] text-[#e8e0d5] group-hover:text-[#1c2d42] border border-[#12100e] text-[8px] sm:text-xs font-bold px-0 py-0.5 text-center leading-none tracking-tighter whitespace-nowrap overflow-hidden">ラジオ</div>';
                }
                innerHTML += '</div>';
                dayCell.innerHTML = innerHTML;

                dayCell.addEventListener("click", function() {
                    openModal(dateKey, liveData, hasRadio);
                });
                calendarDaysEl.appendChild(dayCell);
            }

            const remainingCells = totalGridCells - (firstDay + totalDays);
            for (let nextDay = 1; nextDay <= remainingCells; nextDay++) {
                const emptyCell = document.createElement("div");
                emptyCell.className = "h-12 sm:h-20 border border-[#12100e]/15 bg-gray-50/50 p-0.5 sm:p-1 text-black/30 font-bold text-xs sm:text-base select-none";
                emptyCell.textContent = nextDay;
                calendarDaysEl.appendChild(emptyCell);
            }
        }

        function closeModal() {
            if (modalEl) modalEl.classList.add("hidden");
        }

        if (prevMonthBtn) {
            prevMonthBtn.addEventListener("click", function() {
                displayMonth--;
                if (displayMonth < 0) {
                    displayMonth = 11;
                    displayYear--;
                }
                renderCalendar(displayYear, displayMonth);
            });
        }
        if (nextMonthBtn) {
            nextMonthBtn.addEventListener("click", function() {
                displayMonth++;
                if (displayMonth > 11) {
                    displayMonth = 0;
                    displayYear++;
                }
                renderCalendar(displayYear, displayMonth);
            });
        }
        if (closeModalBtn) closeModalBtn.addEventListener("click", closeModal);
        if (modalCloseBtn) modalCloseBtn.addEventListener("click", closeModal);
        if (modalEl) {
            modalEl.addEventListener("click", function(e) {
                if (e.target === modalEl) closeModal();
            });
        }

        renderCalendar(displayYear, displayMonth);
    </script>
</body>
</html>
